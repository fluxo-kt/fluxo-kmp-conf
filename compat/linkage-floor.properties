# Oldest Kotlin Gradle plugin, AGP and Gradle that fluxo-kmp-conf runs on. `checkFloorLinkage`
# fails when the plugin's classes call API these versions lack, outside code marked
# `@VersionGated`. Raising one raises the consumer minimum: a breaking change (README "Targeted
# for" line, CHANGELOG). Kept out of the version catalog so dependency updates never move it.
#
# AGP: the oldest 8.x on which fluxo's AGP 8 fixtures pass on Gradle 9.0. Older AGP 8 fails on
# Gradle 9 by itself: 8.0 and 8.1 call `DependencyHandler.module`, removed in Gradle 9; 8.2 and 8.3
# use the removed `SelfResolvingDependency` when building.
kotlin=2.1.21
agp=8.4.0
gradle=9.0.0
