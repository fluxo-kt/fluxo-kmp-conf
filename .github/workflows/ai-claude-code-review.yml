name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: read

jobs:
  claude-review:
    if: |
      !github.event.pull_request.draft &&
      !github.event.pull_request.head.repo.fork &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        contains(github.event.pull_request.labels.*.name, 'ai-review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 33

    env:
      REVIEW_PROMPT: ${{ secrets.REVIEW_PROMPT }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Verify Claude settings
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          test -n "$CLAUDE_CODE_OAUTH_TOKEN" || {
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN repository or organization secret."
            exit 1
          }
          test -n "$REVIEW_PROMPT" || {
            echo "::error::Set REVIEW_PROMPT as a repository or organization secret."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 150

      - name: Run Claude Code Review
        id: claude-review
        timeout-minutes: 32
        uses: anthropics/claude-code-action@0f564c8817f4c6b4fa7da9e6fa26d2c0d44ea0b0 # v1.0.96 # actions-up-ignore
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ env.REVIEW_PROMPT }}
          claude_args: |
            --max-turns 300
            --model sonnet
            --fallback-model haiku
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr:*),Bash(gh issue:*),Bash(gh search:*)"
