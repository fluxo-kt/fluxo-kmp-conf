name: Dependency Submission

on:
  push:
    paths-ignore:
      - '**-validation.yml'
      - '**.*ignore'
      - '**.md'
      - '**.txt'
      - '**/actionlint**'
      - '**/pr-**.yml'
      - '**/release.yml'
      - '**dependabot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: "${{ secrets.GRADLE_ENCRYPTION_KEY }}"
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          # Scope the graph to the CONSUMER surface: the published runtime classpath.
          # compileOnly tooling (AGP -> bundletool -> jose4j, lint -> bouncycastle,
          # detekt, ...) resolves in compileClasspath but never ships to consumers;
          # including it floods Dependabot with build-only CVEs that mask the real
          # consumer-facing ones. The prior "^(?!(classpath)).*" only dropped the
          # buildscript `classpath` config, still leaking all of compileClasspath.
          # Anchored ^...$ so it cannot partial-match testRuntimeClasspath et al.
          dependency-graph-include-configurations: "^runtimeClasspath$"
          dependency-graph-include-projects: "^:(?!(buildSrc|test|check)).*"
          artifact-retention-days: 1
