name: Build

on:
  pull_request:
    # The repository uses ff-only merges, but PR checks must still run on the
    # pull_request merge ref so branch protection can gate the exact mergeable tree.
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**-validation.yml'
      - '**.*ignore'
      - '**.md'
      - '**.txt'
      - '**/actionlint**'
      - '**/pr-**.yml'
      - '**/release.yml'
      - '**dependabot.yml'
      # Release/CI helper scripts don't affect the Gradle build; they are
      # shellchecked + unit-tested by the "Validate Workflows & Scripts" workflow.
      - '.github/scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required for all workflows (CodeQL)
  security-events: write
  # required for workflows in private repositories (CodeQL)
  actions: read
  # We appear to need write permission for both pull-requests and
  # issues to post a comment to a pull request.
  pull-requests: write
  issues: write

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}
  #GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: "^(?!(classpath)).*"
  DEPENDENCY_GRAPH_INCLUDE_PROJECTS: "^:(?!(buildSrc|test|check)).*"

jobs:
  buildAndCheck:
    strategy:
      fail-fast: false
      matrix:
        # JDK 21 needed by IntelliJ Platform 2026.* targets (S12). JDK 23 keeps
        # early-warning coverage for newer daemon/toolchain behavior.
        java: ['21', '23']
        # No Windows cell: Windows matters for consumers, not for the plugin's own build, so
        # Windows runs consumer compat fixtures in `integrationChecks` instead.
        os: ['macos', 'ubuntu']
    name: 'Build and check on ${{ matrix.os }} / JDK ${{ matrix.java }}'
    # Keep the job budget above the sum of the guarded Gradle/check steps. Otherwise
    # a slow but healthy matrix leg can be cancelled after its checks already passed.
    timeout-minutes: 90
    runs-on: '${{ matrix.os }}-latest'
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}
    env:
      GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Set up JDK ${{ matrix.java }}'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: "${{ secrets.GRADLE_ENCRYPTION_KEY }}"
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          dependency-graph: disabled
          add-job-summary-as-pr-comment: on-failure
          artifact-retention-days: 1

      - name: 'Build and check plugin itself'
        # Sized for the SLOWEST cell: macOS alone builds the Apple/native (konan) KMP targets
        # ubuntu skips, so it's the bottleneck. 18 min red-flaked macos/JDK23 on a commit
        # green on every other cell + every integration leg. Keep margin over the macOS native
        # wall-time (~18 min + runner variance); < the 90-min job cap so a real hang still trips.
        timeout-minutes: 45
        # `compatibilityTest` is excluded here and runs once in `integrationChecks` instead: it
        # spawns ~19 nested TestKit consumer builds (AGP/KMP/Compose), is OS- and daemon-JDK-
        # independent — each fixture pins its inner build to the JDK its `compat/matrix.tsv`
        # `jdkVersion` declares via `org.gradle.java.home` (see `compatRunner`/`resolveCompatJdkHome`),
        # so the outer daemon JDK can't change results — and took >15 min, so running it on every
        # OS×JDK cell is pure redundancy. `verifyCompatibilityStatic` (OS-path check) stays in `check`.
        run: ./gradlew build assemble check -x compatibilityTest --continue --stacktrace --scan

      - name: Upload sarif report (Detekt)
        if: always() && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/detekt-merged.sarif
          category: detekt

      - name: Upload sarif report (Lint)
        if: always() && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/lint-merged.sarif
          category: lint

      - name: Upload the build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '${{ matrix.os }}-jdk-${{ matrix.java }}-build-report'
          path: |
            **/build/logs/
            **/build/reports/
            **/build/output/
            build/*-merged.*
          compression-level: 9

      - name: "Post result in PR comment"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request' && failure()
        env:
          OS: ${{ matrix.os }}
          GH_WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { OS, GH_WORKFLOW, RUN_URL } = process.env
            github.rest.issues.createComment({
              issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo,
              body: `❌ ${GH_WORKFLOW} [failed](${RUN_URL}) on ${OS}.`,
            })

  integrationChecks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check-gradle-plugin
            directory: checks/gradle-plugin
            command: ./gradlew build assemble check --continue --stacktrace --scan
            timeout: 6
          - name: check-kmp
            directory: checks/kmp
            command: ./gradlew build assemble check printKotlinSourceSetsGraph --continue --stacktrace --scan
            timeout: 12
          - name: check-compose-desktop
            directory: checks/compose-desktop
            command: ./gradlew build assemble check packageReleaseDistributionForCurrentOS --continue --stacktrace --scan
            timeout: 14
          # Keeps the legacy non-KMP Android library path covered after checks/kmp
          # moved to the AGP-9 KMP+Android plugin line.
          - name: check-android
            directory: checks/android
            command: ./gradlew build assemble check --continue --stacktrace --scan
            timeout: 8
          - name: self-check
            directory: self
            command: ./gradlew build assemble check --continue --stacktrace --scan
            timeout: 4
          # The compatibility TestKit suite, excluded from the per-OS×JDK `build assemble
          # check` step, runs here as one leg per fixture class so each leg stays short and a
          # failure names its toolchain line. Every compat test class
          # must match one leg's `--tests` pattern: `CompatibilityShardGuardTest` fails
          # otherwise, so a new fixture class can't go unrun. Timeouts allow for a cold
          # (read-only on non-default branches) Gradle cache re-downloading the pinned tools.
          - name: compat-android
            directory: .
            command: ./gradlew :plugin:compatibilityTest --tests 'fluxo.compat.Android*' --continue --stacktrace --scan
            timeout: 20
          - name: compat-compose
            directory: .
            command: ./gradlew :plugin:compatibilityTest --tests 'fluxo.compat.Compose*' --continue --stacktrace --scan
            timeout: 20
          - name: compat-gradle-plugin
            directory: .
            command: ./gradlew :plugin:compatibilityTest --tests 'fluxo.compat.GradlePlugin*' --continue --stacktrace --scan
            timeout: 15
          - name: compat-kmp
            directory: .
            command: ./gradlew :plugin:compatibilityTest --tests 'fluxo.compat.Kmp*' --continue --stacktrace --scan
            timeout: 15
          - name: compat-kotlin-jvm
            directory: .
            command: ./gradlew :plugin:compatibilityTest --tests 'fluxo.compat.KotlinJvm*' --tests 'fluxo.compat.Compatibility*' --continue --stacktrace --scan
            timeout: 15
          # Windows matters for consumers, not for the plugin's own build: the Kotlin/JVM
          # consumer fixtures run here, the plugin itself builds on ubuntu and macOS only.
          - name: compat-kotlin-jvm-windows
            os: windows
            directory: .
            command: ./gradlew :plugin:compatibilityTest --tests 'fluxo.compat.KotlinJvm*' --tests 'fluxo.compat.Compatibility*' --continue --stacktrace --scan
            timeout: 25
    name: 'Integration check / ${{ matrix.name }}'
    # Above the largest leg step (25) plus checkout/JDK/Gradle setup overhead, so a
    # healthy-but-slow leg is never cancelled mid-flight.
    timeout-minutes: 35
    runs-on: "${{ matrix.os || 'ubuntu' }}-latest"
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}
    env:
      GITHUB_DEPENDENCY_GRAPH_ENABLED: false
      GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 21 is the daemon (last = default JAVA_HOME); 17 is installed for `compatibilityTest`
      # inner builds, which pin per-row JDK via the `org.gradle.java.home` property, resolving
      # the home from JAVA_HOME_17_<arch>. See `resolveCompatJdkHome` — fixtures fail loudly if
      # their declared jdkVersion is absent.
      - name: Set up JDKs (21 daemon and compat inner builds, 17 for compat inner builds)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        # setup-gradle's cache restore can fail on Windows before Gradle runs; the build step
        # then still runs and decides the leg.
        continue-on-error: ${{ matrix.os == 'windows' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: "${{ secrets.GRADLE_ENCRYPTION_KEY }}"
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          dependency-graph: disabled
          add-job-summary-as-pr-comment: on-failure
          artifact-retention-days: 1

      - name: 'Run ${{ matrix.name }}'
        timeout-minutes: ${{ matrix.timeout }}
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

      - name: Upload the integration build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '${{ matrix.name }}-build-report'
          # The `!…*:*` line: Compose compiler reports are named after the Kotlin module name
          # (`group:project`), and upload-artifact fails the whole upload on ':' in a path.
          path: |
            ${{ matrix.directory }}/**/build/logs/
            ${{ matrix.directory }}/**/build/reports/
            ${{ matrix.directory }}/**/build/output/
            !${{ matrix.directory }}/**/build/reports/**/*:*
          compression-level: 9

      - name: "Post result in PR comment"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request' && failure()
        env:
          CHECK_NAME: ${{ matrix.name }}
          GH_WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { CHECK_NAME, GH_WORKFLOW, RUN_URL } = process.env
            github.rest.issues.createComment({
              issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo,
              body: `❌ ${GH_WORKFLOW} [failed](${RUN_URL}) on ${CHECK_NAME}.`,
            })

  codeql:
    name: CodeQL
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: "${{ secrets.GRADLE_ENCRYPTION_KEY }}"
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          dependency-graph: disabled
          add-job-summary-as-pr-comment: on-failure
          artifact-retention-days: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: restore

      - name: Compile plugin for CodeQL
        timeout-minutes: 10
        run: ./gradlew :plugin:compileKotlin --rerun-tasks --continue --stacktrace

      - name: Perform CodeQL Analysis
        timeout-minutes: 12
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin


