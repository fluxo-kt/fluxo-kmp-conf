name: Validate Workflows & Scripts

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/actions/**.yml'
      - '.github/actions/**.yaml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.github/actions/**.yml'
      - '.github/actions/**.yaml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate action metadata YAML
        shell: bash
        run: |
          git ls-files '.github/actions/*.yml' '.github/actions/*.yaml' '.github/actions/**/*.yml' '.github/actions/**/*.yaml' \
            | xargs -r ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file) }'

      - name: Shellcheck scripts
        shell: bash
        run: |
          git ls-files '.github/scripts/*.sh' | xargs -r shellcheck

      - uses: ./.github/actions/actionlint
